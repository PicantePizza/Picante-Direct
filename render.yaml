services:
  - type: web
    name: picante-direct-operations-test
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4
    envVars:
      - key: HOSTED_TEST_MODE
        value: "1"
      - key: APP_SECRET
        generateValue: true
      - key: TEST_USERNAME
        sync: false
      - key: TEST_PASSWORD
        sync: false
